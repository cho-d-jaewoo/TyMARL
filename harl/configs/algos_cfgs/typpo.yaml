algorithm:
  name: typpo
  type: on_policy_stochastic
group_partition:
  mode: auto
  groups: null
optim:
  actor_lr: 0.0005
  critic_lr: 0.0005
  optim_eps: 1.0e-05
  weight_decay: 0
ppo:
  clip_param: 0.2
  ppo_epoch: 5
  num_mini_batch: 1
  entropy_coef: 0.015
  value_loss_coef: 1.0
  max_grad_norm: 10.0
  use_clipped_value_loss: true
  use_huber_loss: true
  huber_delta: 10.0
  use_gae: true
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.06
  use_value_norm: true
sequential_update:
  random_group_permutation: true
train:
  num_env_steps: 10000000
  # Pack ~4 episodes into one rollout for stable PPO ratio statistics.
  episode_length: 800
  n_rollout_threads: 1
log:
  log_interval: 5
  save_interval: 100
  use_tensorboard: false
  use_wandb: false
