# MPE simple_speaker_listener, DISCRETE -- for PPO-family algorithms.
# K=2 heterogeneous (1 speaker + 1 listener), the primary scenario where
# TyM*'s group-level type-aware learning is meaningful in MPE.

env:
  name: mpe
  scenario: simple_speaker_listener_v4
  num_agents: 2
  episode_length: 25
  continuous_actions: false

groups: per_agent
