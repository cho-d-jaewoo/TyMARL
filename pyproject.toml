[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tymarl"
version = "0.1.0"
description = "Heterogeneous-Group Reinforcement Learning (TyPPO, TySAC)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "The TyMARL Authors" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "tensorboard>=2.13",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
smac = ["pysc2>=4.0"]
mamujoco = ["mujoco>=2.3", "gym>=0.26"]
mpe = ["pettingzoo>=1.24", "supersuit>=3.9"]
viz = ["matplotlib>=3.7", "pandas>=2.0", "seaborn>=0.12"]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = [
    "pysc2>=4.0", "mujoco>=2.3", "gym>=0.26",
    "pettingzoo>=1.24", "supersuit>=3.9",
    "matplotlib>=3.7", "pandas>=2.0", "seaborn>=0.12",
    "wandb>=0.16",
]

[project.urls]
Repository = "https://github.com/cho-d-jaewoo/TyMARL"

[tool.setuptools.packages.find]
include = ["harl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B"]
ignore = ["E501"]
